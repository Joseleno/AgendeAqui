name: CI

on:
  push:
    branches: [ main, develope ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agendeaqui
          POSTGRES_USER: agendeaqui
          POSTGRES_PASSWORD: agendeaqui_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Integration"

      - name: Integration Tests
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~Integration"
        env:
          ConnectionStrings__Database: "Host=localhost;Port=5432;Database=agendeaqui;Username=agendeaqui;Password=agendeaqui_dev"
          RabbitMq__HostName: localhost
          RabbitMq__Port: "5672"
          RabbitMq__UserName: guest
          RabbitMq__Password: guest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
