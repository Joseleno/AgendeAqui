services:
  postgres:
    image: postgres:16-alpine
    container_name: agendeaqui-postgres
    environment:
      POSTGRES_DB: agendeaqui
      POSTGRES_USER: agendeaqui
      POSTGRES_PASSWORD: agendeaqui_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendeaqui"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agendeaqui-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: agendeaqui
      RABBITMQ_DEFAULT_PASS: agendeaqui_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
